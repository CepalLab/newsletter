<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Chain-of-thought: razonamiento encadenado">
  <defs>
    <linearGradient id="cot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#036BAA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#025a8f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cot-bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#036BAA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#036BAA" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="cot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#036BAA" stroke-width="0.4" stroke-opacity="0.10"/>
    </pattern>
    <filter id="cot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#036BAA" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#cot-bg-grad)"/>
  <rect width="400" height="300" fill="url(#cot-grid)"/>

  <!-- Document at the start (left) -->
  <g filter="url(#cot-shadow)">
    <rect x="22" y="100" width="60" height="78" rx="4" fill="#FFFFFF" stroke="#036BAA" stroke-width="1.4"/>
    <line x1="32" y1="116" x2="72" y2="116" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.45"/>
    <line x1="32" y1="126" x2="72" y2="126" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.30"/>
    <line x1="32" y1="136" x2="64" y2="136" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.30"/>
    <line x1="32" y1="146" x2="72" y2="146" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.30"/>
    <line x1="32" y1="156" x2="60" y2="156" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.30"/>
    <line x1="32" y1="166" x2="68" y2="166" stroke="#036BAA" stroke-width="1.2" stroke-opacity="0.30"/>
  </g>
  <text x="52" y="194" font-family="IBM Plex Mono, monospace" font-size="9" fill="#036BAA" text-anchor="middle" font-weight="500" letter-spacing="0.08em">DOC</text>

  <!-- Connecting paths -->
  <path d="M 86 139 Q 110 139 120 110" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <path d="M 86 139 Q 110 139 120 168" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <path d="M 86 139 Q 110 139 120 226" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>

  <!-- Three intermediate reasoning nodes (the "chain") -->
  <g filter="url(#cot-shadow)">
    <rect x="120" y="86" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#036BAA" stroke-width="1.2"/>
    <circle cx="135" cy="107" r="5" fill="url(#cot-grad)"/>
    <text x="135" y="111" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
    <text x="148" y="103" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#1A1A1A" font-weight="600">Problema</text>
    <text x="148" y="116" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#1A1A1A" fill-opacity="0.65">¿qué quiere transformar?</text>
  </g>

  <g filter="url(#cot-shadow)">
    <rect x="120" y="146" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#036BAA" stroke-width="1.2"/>
    <circle cx="135" cy="167" r="5" fill="url(#cot-grad)"/>
    <text x="135" y="171" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
    <text x="148" y="163" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#1A1A1A" font-weight="600">Actor</text>
    <text x="148" y="176" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#1A1A1A" fill-opacity="0.65">¿quién es el sujeto?</text>
  </g>

  <g filter="url(#cot-shadow)">
    <rect x="120" y="206" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#036BAA" stroke-width="1.2"/>
    <circle cx="135" cy="227" r="5" fill="url(#cot-grad)"/>
    <text x="135" y="231" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
    <text x="148" y="223" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#1A1A1A" font-weight="600">Intervención</text>
    <text x="148" y="236" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#1A1A1A" fill-opacity="0.65">¿qué cambio propone?</text>
  </g>

  <!-- Convergence to result -->
  <path d="M 240 107 Q 280 107 295 165" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <path d="M 240 167 Q 270 167 295 167" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <path d="M 240 227 Q 280 227 295 169" fill="none" stroke="#036BAA" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="3 3"/>

  <!-- Final result: classification badge -->
  <g filter="url(#cot-shadow)">
    <rect x="295" y="128" width="78" height="78" rx="40" fill="url(#cot-grad)"/>
    <text x="334" y="160" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="500" letter-spacing="0.08em" opacity="0.85">TRANSF.</text>
    <text x="334" y="186" font-family="IBM Plex Sans, sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="700">#11</text>
  </g>

  <!-- Caption labels -->
  <text x="200" y="46" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#036BAA" text-anchor="middle" font-weight="600" letter-spacing="0.18em">CHAIN-OF-THOUGHT</text>
  <line x1="148" y1="56" x2="252" y2="56" stroke="#036BAA" stroke-width="1" stroke-opacity="0.35"/>
  <text x="200" y="72" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="300" font-style="italic">pensar antes de etiquetar</text>
</svg>
